services:
  - type: web
    name: rcv-pilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: RCV_VERSION
        value: RCV-V1.0-PILOT-001
      - key: DATABASE_URL
        fromDatabase:
          name: rcv-pilot-db
          property: connectionString

databases:
  - name: rcv-pilot-db
    plan: free
    postgresMajorVersion: "18"
    databaseName: rcvpilot
    user: rcvpilot
